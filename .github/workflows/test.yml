name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suite
        run: node --test tests/*.test.mjs tests/*.smoke.js

      - name: Set up Python for live Pages QA
        if: github.repository == 'yuxiaoli/codeflow' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chromium for live Pages QA
        if: github.repository == 'yuxiaoli/codeflow' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Verify published Pages files match this commit
        if: github.repository == 'yuxiaoli/codeflow' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: python scripts/verify-pages-assets.py

      - name: Verify live Pages in Chromium
        if: github.repository == 'yuxiaoli/codeflow' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
        run: python scripts/verify-pages.py

      - name: Upload live Pages QA evidence
        if: always() && github.repository == 'yuxiaoli/codeflow' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pages-qa-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
